<section class="calendar" aria-label="Calendar">
  <h2 class="calendar-title" data-calendar-title></h2>
  <header class="calendar-header">
    <button class="calendar-nav" type="button" data-calendar-previous aria-label="Previous month">‹</button>
    <h2 data-calendar-month></h2>
    <button class="calendar-nav" type="button" data-calendar-next aria-label="Next month">›</button>
  </header>
  <div class="calendar-weekdays" data-calendar-weekdays aria-hidden="true"></div>
  <div class="calendar-days" data-calendar-days role="grid" aria-label="Days"></div>
  <footer class="calendar-footer">
    <p data-calendar-selected aria-live="polite"></p>
    <button class="calendar-today" type="button" data-calendar-today hidden></button>
  </footer>
</section>
